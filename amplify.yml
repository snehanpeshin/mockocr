version: 1
applications:
  - appRoot: frontend
    env:
      variables:
        NEXT_PUBLIC_API_BASE_URL: https://replace-with-your-app-runner-url
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
